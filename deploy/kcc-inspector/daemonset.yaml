apiVersion: v1
kind: Service
metadata:
  name: kcc-inspector
  namespace: kube-system
spec:
  type: ClusterIP
  ports:
    - name: kcc-inspector
      protocol: TCP
      port: 9090
      targetPort: 9090
  selector:
    app: kcc-inspector
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kcc-inspector
  namespace: kube-system
  labels:
    app: kcc-inspector
spec:
  selector:
    matchLabels:
      app: kcc-inspector
  template:
    metadata:
      labels:
        app: kcc-inspector
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: kcc-inspector
          image: kcc:latest
          imagePullPolicy: IfNotPresent
          command: ["kcc", "node-inspector"]
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KCC_NODE_INSPECTOR_ADDR
              value: '0.0.0.0:9090'
            - name: KCC_HOST_ROOT
              value: '/host'
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            seLinuxOptions:
              type: "spc_t"
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /kcc/api/health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /kcc/api/health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory